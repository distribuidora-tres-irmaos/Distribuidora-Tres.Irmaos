<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pedido de Água</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  
</head>

<body>

<div class="card">

  <header>
    <h1>💧 Distribuidora Três Irmãos</h1>
    <div class="linha"></div>
    <p>Água Mineral</p>
  </header>

  <form id="order-form">

    <section>
      <h2> Dados do cliente</h2>
      <input id="nome" placeholder="Nome completo" required>
      <input id="telefone" placeholder="Telefone / WhatsApp" required>
    </section>

   <section>
  <h2>Endereço de entrega</h2>

  <label for="bairro">Bairro</label>
  <select id="bairro" name="bairro" required>
    <option value="">Selecione o bairro</option>
    <option>Alto da Bela Vista</option>
    <option>Alto da Cruz</option>
    <option>Alto do Triângulo</option>
    <option>Burissatuba</option>
    <option>Camaçari de Dentro</option>
    <option>Centro</option>
    <option>Christo Redentor</option>
    <option>Dois de Julho</option>
    <option>Ficam</option>
    <option>Gleba A</option>
    <option>Gleba B</option>
    <option>Gleba C</option>
    <option>Gleba E</option>
    <option>Gravatá</option>
    <option>Industrial</option>
    <option>Inocoop</option>
    <option>Lama Preta</option>
    <option>Limoeiro</option>
    <option>Mangueiral</option>
    <option>Novo Horizonte</option>
    <option>Parque Satélite</option>
    <option>Parque Verde I</option>
    <option>Parque Verde II</option>
    <option>Parque Verde III</option>
    <option>Piaçaveira</option>
    <option>Phoc I</option>
    <option>Phoc II</option>
    <option>Phoc III</option>
    <option>Ponto Certo</option>
    <option>Parque das Mangabas</option>
    <option>Setor Industrial Urbano</option>
    <option>Triângulo</option>
    <option>Verdes Horizontes</option>
  </select>

  <label for="endereco">Endereço (Rua, número, referência)</label>
  <input
    type="text"
    id="endereco"
    name="endereco"
    placeholder="Ex: Rua das Flores, nº 120, perto do mercado"
    required>
</section>


    <section>
      <h2> Garrafões</h2>

      <input id="totalGarrafoes" type="number" min="10" placeholder="Quantidade total (mín. 10)" required>

      <div class="grid">
        <input id="v2026" type="number" min="0" placeholder="2026">
        <input id="v2027" type="number" min="0" placeholder="2027">
        <input id="v2028" type="number" min="0" placeholder="2028">
        <input id="v2029" type="number" min="0" placeholder="2029">
      </div>

      <p id="erro">⚠️ Quantidade mínima 10</p>
    </section>

    <div class="total">
      <span>Total:</span>
      <strong>R$ <span id="totalPreco">0,00</span></strong>
    </div>

    <button type="submit">🚚 Confirmar pedido</button>

  </form>
</div>

<script src="script.js"></script>
</body>
</html>
